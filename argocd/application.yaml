apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: advance-trading
  namespace: argocd
spec:
  project: advance-trading
  source:
    repoURL: https://github.com/karen-judith/advance.git
    targetRevision: main
    path: k8s
    kustomize:
      namePrefix: ""
  destination:
    server: https://kubernetes.default.svc
    namespace: advance-trading
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
