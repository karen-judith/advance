apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: advance-trading
  labels:
    app: advance-trading
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      component: backend
  template:
    metadata:
      labels:
        component: backend
    spec:
      containers:
      - name: backend
        image: karenhjhi/advance-trading-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
        env:
        - name: DATABASE_URL
          valueFrom:
            configMapKeyRef:
              name: advance-config
              key: DATABASE_URL
        - name: SMTP_HOST
          valueFrom:
            configMapKeyRef:
              name: advance-config
              key: SMTP_HOST
        - name: SMTP_PORT
          valueFrom:
            configMapKeyRef:
              name: advance-config
              key: SMTP_PORT
        - name: SMTP_SECURE
          valueFrom:
            configMapKeyRef:
              name: advance-config
              key: SMTP_SECURE
        - name: ALLOWED_ORIGINS
          valueFrom:
            configMapKeyRef:
              name: advance-config
              key: ALLOWED_ORIGINS
        - name: SMTP_USER
          valueFrom:
            secretKeyRef:
              name: advance-secrets
              key: SMTP_USER
        - name: SMTP_PASS
          valueFrom:
            secretKeyRef:
              name: advance-secrets
              key: SMTP_PASS
        - name: ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: advance-secrets
              key: ENCRYPTION_KEY
        - name: MERCADOPAGO_ACCESS_TOKEN
          valueFrom:
            secretKeyRef:
              name: advance-secrets
              key: MERCADOPAGO_ACCESS_TOKEN
        - name: MERCADOPAGO_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              name: advance-secrets
              key: MERCADOPAGO_PUBLIC_KEY
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/precios
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /api/precios
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 15
