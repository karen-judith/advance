apiVersion: apps/v1
kind: Deployment
metadata:
  name: advance-trading-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: advance-trading-backend
  template:
    metadata:
      labels:
        app: advance-trading-backend
    spec:
      containers:
      - name: backend
        image: advance-trading-backend:latest
        ports:
        - containerPort: 5000
        env:
        - name: DATABASE_URL
          value: "postgresql://postgres:postgres@db:5432/advance"
        - name: SMTP_HOST
          value: "smtp.gmail.com"
        - name: SMTP_PORT
          value: "465"
        - name: SMTP_SECURE
          value: "true"
        - name: SMTP_USER
          valueFrom:
            secretKeyRef:
              name: smtp-credentials
              key: SMTP_USER
        - name: SMTP_PASS
          valueFrom:
            secretKeyRef:
              name: smtp-credentials
              key: SMTP_PASS
